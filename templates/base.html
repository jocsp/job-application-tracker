<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Job Application Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="{{ url_for('home') }}">Job Application Tracker</a>
        <nav aria-label="Main navigation">
            <a href="{{ url_for('home') }}">Dashboard</a>
            <a href="{{ url_for('companies_list') }}">Companies</a>
            <a href="{{ url_for('jobs_list') }}">Jobs</a>
            <a href="{{ url_for('job_match') }}">Job Match</a>
            <a href="{{ url_for('contacts_list') }}">Contacts</a>
            <a href="{{ url_for('applications_list') }}">Applications</a>
        </nav>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            <div class="toast-container" aria-live="polite" aria-relevant="additions">
                {% for category, message in messages %}
                    <div class="toast toast-{{ category }}"
                         data-autohide="{{ 'true' if category in ['success', 'info'] else 'false' }}"
                         role="{{ 'alert' if category == 'error' else 'status' }}">
                        <p>{{ message }}</p>
                        <button class="toast-close" type="button" aria-label="Dismiss notification">&times;</button>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    <main class="page">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
